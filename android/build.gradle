// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Keep generated Gradle output outside OneDrive. Synced files can be locked
// during Gradle cleanup, including app classes and Capacitor modules in
// node_modules. Include a project-path hash so separate checkouts do not clash.
def guideVoyagerLocalData = System.getenv('LOCALAPPDATA') ?: System.getProperty('user.home')
def guideVoyagerBuildRoot = new File(
    guideVoyagerLocalData,
    "GuideVoyager/gradle-build/${rootProject.projectDir.name}-${Integer.toHexString(rootProject.projectDir.absolutePath.hashCode())}"
)

subprojects { subproject ->
    subproject.buildDir = new File(guideVoyagerBuildRoot, subproject.name)
}

task clean(type: Delete) {
    delete rootProject.buildDir
    delete guideVoyagerBuildRoot
}
