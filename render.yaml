services:
  - type: web
    name: guide-voyager
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build:mobile
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
